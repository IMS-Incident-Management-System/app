  #     retries: 3
  #     start_period: 10s

  ims-keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: unless-stopped
    container_name: ims-keycloak
    env_file:
    #  - ./.env/.keycloak.development.env
      - ./.env/.keycloak.prod.env
    volumes:
      - ./keycloak:/opt/keycloak/conf
    ports:
      - "8087:8087"
    command: [ "start-dev", "--http-port=8087" ]
    depends_on:
      - ims-keycloak-db
    networks:
      - ims-base-network

  ims-keycloak-db:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: ims-keycloak-db
    env_file:
      - ./.env/.keycloak.development.env
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - ims-base-network

  ims-postgres:
    image: postgres
    restart: unless-stopped
    env_file:
      - ./.env/.postgres.prod.env
    volumes:
      - iml-db-data:/var/lib/postgresql/data
    networks:
      - ims-base-network

  ims-pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    container_name: ims-pgadmin
    env_file:
      - ./.env/.pgadmin.development.env
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - ims-base-network
    depends_on:
      - ims-postgres

volumes:
  keycloak-db-data:
  iml-db-data:
  pgadmin-data:

networks:
  ims-base-network:
    driver: bridge
