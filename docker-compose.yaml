services:
  ims-nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: ims-nginx
    ports:
      - 80:80
    env_file:
      - ./frontend/.env
    networks:
      - ims-base-network

  ims-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    container_name: ims-backend
    env_file:
    #  - ./.env/.backend.development.env
      - ./.env/.backend.prod.env
    networks:
      - ims-base-network

  # rag_mongodb:
