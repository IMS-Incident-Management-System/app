name: Deploy IMS Application

on:
  push:
    branches: [ main ]

jobs:
  deploy-ssh:
    runs-on: self-hosted
    environment: IMS
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        run: |
          set -e
          
          # Копируем содержимое папки app на сервер
          sshpass -p '${{ secrets.DEPLOY_PASSWORD }}' \
            scp -P ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=no -r ./app/* ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/ims/
          
          # Деплой на сервере
          sshpass -p '${{ secrets.DEPLOY_PASSWORD }}' \
            ssh -o StrictHostKeyChecking=no \
                -o ConnectTimeout=30 \
                -p ${{ secrets.DEPLOY_PORT }} \
                ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "set -e; \
             mkdir -p ~/ims; \
             cd ~/ims; \
             echo 'Stopping all containers...'; \
             docker compose down 2>/dev/null || true; \
             echo 'Cleaning up old containers...'; \
             docker container prune -f; \
             docker image prune -f; \
             echo 'Starting deployment process...'; \
             echo '=== Step 1: Ensure .env exists (secrets — вручную на сервере) ==='; \
             if [ ! -f .env ]; then \
               echo 'Creating minimal .env (дозаполнить секреты на сервере)'; \
               echo 'NODE_ENV=production' > .env; \
               echo 'NGINX_CONTAINER_NAME=ims-nginx' >> .env; \
             else \
               echo '.env already exists'; \
             fi; \
             echo '=== Step 2: Run deploy-cert.sh ==='; \
             if [ -f scripts/deploy-cert.sh ]; then \
               chmod +x scripts/deploy-cert.sh; \
               bash scripts/deploy-cert.sh production; \
             else \
               echo 'deploy-cert.sh not found, creating basic volumes'; \
               docker volume create certs 2>/dev/null || true; \
               docker volume create webroot 2>/dev/null || true; \
             fi; \
             echo '=== Step 3: Build frontend ==='; \
             curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash - || echo 'Node.js setup skipped'; \
             sudo apt-get install -y nodejs || echo 'Node.js already installed'; \
             cd frontend; \
             echo 'Creating frontend .env file:'; \
             echo 'NODE_ENV=production' > .env; \
             echo 'baseURLKeycloakFE=https://ims-mts.ru:8087' >> .env; \
             echo 'REACT_APP_PROD_URL_KEYCLOAK=https://ims-mts.ru:8087' >> .env; \
             echo 'REACT_APP_PROD_URL_BACKEND=https://ims-mts.ru/api' >> .env; \
             echo 'Frontend .env created:'; \
             cat .env; \
             npm install; \
             npm run build; \
             echo 'Cleaning up node_modules after build...'; \
             rm -rf node_modules; \
             cd ..; \
             echo '=== Step 4: Start all services ==='; \
             docker compose up -d --build; \
             echo 'Deployment completed successfully!'"