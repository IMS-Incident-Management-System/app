name: Publish Infra Archive to Nexus

on:
  push:
    branches: [ main ]

env:
  NEXUS_URL: https://nexus.code-generation.ru/repository/raw-company-artifacts/infra
  MINIO_ENDPOINT: https://s3.minio.code-generation.ru
  MINIO_BUCKET: codegen-backup/backups/nexus/artifacts/raw-company-artifacts/infra

jobs:
  deploy-ssh:
    runs-on: self-hosted
    environment: NEXUS
    timeout-minutes: 20
    outputs:
      archive_name: ${{ steps.ssh-deploy.outputs.archive_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        id: ssh-deploy
        run: |
          set -e
          ARCHIVE=infra-$(date +%Y%m%d%H%M%S).tar.gz
          
          # Копируем папку app на сервер
          sshpass -p '${{ secrets.DEPLOY_PASSWORD }}' \
            scp -P ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=no -r ./app ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/infra/
          
          # Деплой и создание архива на сервере
          sshpass -p '${{ secrets.DEPLOY_PASSWORD }}' \
            ssh -o StrictHostKeyChecking=no \
                -o ConnectTimeout=30 \
                -p ${{ secrets.DEPLOY_PORT }} \
                ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "set -e; \
             mkdir -p ~/infra; \
             cd ~/infra; \
             echo 'Stopping all infra containers...'; \
             docker compose --profile ssl down 2>/dev/null || true; \
             docker compose --profile infra down 2>/dev/null || true; \
             echo 'Cleaning up old containers...'; \
             docker rm -f codegen-ssl-nginx codegen-certbot codegen-nginx-proxy codegen-vault codegen-backup-cron 2>/dev/null || true; \
             echo 'Cleaning up unused images and networks...'; \
             docker system prune -f; \
             echo 'Setting up configuration...'; \
             cd app; \
             echo 'VAULT_ADDR=${{ secrets.VAULT_ADDR }}' > .env; \
             echo 'VAULT_API_ADDR=${{ secrets.VAULT_API_ADDR }}' >> .env; \
             echo 'VAULT_CLUSTER_ADDR=${{ secrets.VAULT_CLUSTER_ADDR }}' >> .env; \
             echo 'MINIO_ALIAS=codegen-backup' >> .env; \
             echo 'MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}' >> .env; \
             echo 'MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}' >> .env; \
             echo 'MINIO_VAULT_BUCKET=${{ secrets.MINIO_VAULT_BUCKET }}' >> .env; \
             echo 'Starting services...'; \
             bash start.sh; \
             cd ..; \
             echo 'Creating archive...'; \
             tar czf $ARCHIVE app; \
             echo 'Archive created: $ARCHIVE'; \
             du -h $ARCHIVE"
          
          # Скачиваем архив с сервера
          sshpass -p '${{ secrets.DEPLOY_PASSWORD }}' \
            scp -P ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/infra/$ARCHIVE .
          
          echo "archive_name=$ARCHIVE" >> $GITHUB_OUTPUT

  nexus-publish:
    needs: deploy-ssh
    runs-on: self-hosted
    environment: NEXUS
    steps:
      - name: Публикация архива в Nexus
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ARCHIVE_NAME=${{ needs.deploy-ssh.outputs.archive_name }}
          curl -u "$NEXUS_USER:$NEXUS_PASSWORD" \
            --upload-file $ARCHIVE_NAME \
            "${{ env.NEXUS_URL }}/$ARCHIVE_NAME"
          
          # Проверяем успешность загрузки
          curl -u "$NEXUS_USER:$NEXUS_PASSWORD" \
            -I "${{ env.NEXUS_URL }}/$ARCHIVE_NAME" | grep -q "200 OK" || exit 1

  minio-backup:
    needs: [deploy-ssh, nexus-publish]
    runs-on: self-hosted
    environment: NEXUS
    timeout-minutes: 15
    steps:
      - name: Download archive from Nexus
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ARCHIVE_NAME=${{ needs.deploy-ssh.outputs.archive_name }}
          curl -u "$NEXUS_USER:$NEXUS_PASSWORD" \
            -o "$ARCHIVE_NAME" \
            "${{ env.NEXUS_URL }}/$ARCHIVE_NAME"
          
          # Проверяем целостность архива
          tar tzf "$ARCHIVE_NAME" > /dev/null || exit 1

      - name: Install MinIO Client
        run: |
          wget -q https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
      
      - name: Upload archive to MinIO
        env:
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          ARCHIVE_NAME=${{ needs.deploy-ssh.outputs.archive_name }}
          ./mc alias set codegen-backup "${{ env.MINIO_ENDPOINT }}" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
          ./mc cp "$ARCHIVE_NAME" "${{ env.MINIO_BUCKET }}/"
          
          # Проверяем успешность загрузки
          ./mc ls "${{ env.MINIO_BUCKET }}/$ARCHIVE_NAME" || exit 1
          echo "Backup uploaded: $ARCHIVE_NAME"