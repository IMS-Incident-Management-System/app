name: Deploy IMS Application

on:
  push:
    branches: [ main ]

env:
  NEXUS_URL: https://nexus.code-generation.ru/repository/raw-client-artifacts/ims
  MINIO_ENDPOINT: https://s3.minio.code-generation.ru
  MINIO_BUCKET: codegen-backup/backups/nexus/artifacts/raw-client-artifacts/ims

jobs:
  deploy-ssh:
    runs-on: self-hosted
    environment: IMS
    timeout-minutes: 20
    outputs:
      archive_name: ${{ steps.ssh-deploy.outputs.archive_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        id: ssh-deploy
        run: |
          set -e
          ARCHIVE=ims-$(date +%Y%m%d%H%M%S).tar.gz
          
          # Копируем содержимое папки app на сервер
          sshpass -p '${{ secrets.DEPLOY_PASSWORD }}' \
            scp -P ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=no -r ./app/* ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/ims/
          
          # Деплой и создание архива на сервере
          sshpass -p '${{ secrets.DEPLOY_PASSWORD }}' \
            ssh -o StrictHostKeyChecking=no \
                -o ConnectTimeout=30 \
                -p ${{ secrets.DEPLOY_PORT }} \
                ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "set -e; \
             mkdir -p ~/ims; \
             cd ~/ims; \
             echo 'Stopping all containers...'; \
             docker compose down 2>/dev/null || true; \
             echo 'Cleaning up old containers...'; \
             docker container prune -f; \
             docker image prune -f; \
             echo 'Starting deployment process...'; \
             echo 'Creating .env-files directory and secrets...'; \
             mkdir -p .env-files; \
             echo 'VAULT_USER=${{ secrets.VAULT_USER }}' > .env-files/.env-generator.env; \
             echo 'VAULT_PASS=${{ secrets.VAULT_PASSWORD }}' >> .env-files/.env-generator.env; \
             echo 'VAULT_PATH=${{ secrets.VAULT_PATH }}' >> .env-files/.env-generator.env; \
             echo 'Step 1: Running deploy-cert.sh...'; \
             pwd; \
             ls -la; \
             ls -la scripts/ || echo 'scripts directory not found'; \
             if [ -f scripts/deploy-cert.sh ]; then \
               chmod +x scripts/deploy-cert.sh; \
               bash scripts/deploy-cert.sh production; \
             else \
               echo 'ERROR: scripts/deploy-cert.sh not found, skipping SSL setup'; \
               echo 'Creating basic SSL volumes...'; \
               docker volume create certs 2>/dev/null || true; \
               docker volume create webroot 2>/dev/null || true; \
             fi; \
             echo 'Step 2: Running ims-env-generator...'; \
             docker compose --profile ims-env-generator up --pull always; \
             docker compose --profile ims-env-generator down; \
             echo 'Step 3: Installing Node.js and building frontend...'; \
             curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -; \
             sudo apt-get install -y nodejs || echo 'Node.js already installed'; \
             node --version; \
             npm --version; \
             cd frontend; \
             echo 'Creating frontend .env file...'; \
             cp ../.env .env 2>/dev/null || touch .env; \
             sed -i 's/NODE_ENV=development/NODE_ENV=production/g' .env; \
             echo 'Frontend NODE_ENV set to production'; \
             echo 'Installing frontend dependencies...'; \
             npm install; \
             echo 'Building frontend...'; \
             npm run build; \
             ls -la dist/; \
             cd ..; \
             echo 'Step 4: Starting all services...'; \
             docker compose up -d --build; \
             echo 'Deployment completed successfully!'; \
             echo 'Creating archive...'; \
             tar czf $ARCHIVE .; \
             echo 'Archive created: $ARCHIVE'; \
             du -h $ARCHIVE"
          
          # Скачиваем архив с сервера
          sshpass -p '${{ secrets.DEPLOY_PASSWORD }}' \
            scp -P ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/ims/$ARCHIVE .
          
          echo "archive_name=$ARCHIVE" >> $GITHUB_OUTPUT

  nexus-publish:
    needs: deploy-ssh
    runs-on: self-hosted
    environment: IMS
    steps:
      - name: Публикация архива в Nexus
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ARCHIVE_NAME=${{ needs.deploy-ssh.outputs.archive_name }}
          curl -u "$NEXUS_USER:$NEXUS_PASSWORD" \
            --upload-file $ARCHIVE_NAME \
            "${{ env.NEXUS_URL }}/$ARCHIVE_NAME"
          
          # Проверяем успешность загрузки
          curl -u "$NEXUS_USER:$NEXUS_PASSWORD" \
            -I "${{ env.NEXUS_URL }}/$ARCHIVE_NAME" | grep -q "200 OK" || exit 1

  minio-backup:
    needs: [deploy-ssh, nexus-publish]
    runs-on: self-hosted
    environment: IMS
    timeout-minutes: 15
    steps:
      - name: Download archive from Nexus
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ARCHIVE_NAME=${{ needs.deploy-ssh.outputs.archive_name }}
          curl -u "$NEXUS_USER:$NEXUS_PASSWORD" \
            -o "$ARCHIVE_NAME" \
            "${{ env.NEXUS_URL }}/$ARCHIVE_NAME"
          
          # Проверяем целостность архива
          tar tzf "$ARCHIVE_NAME" > /dev/null || exit 1

      - name: Install MinIO Client
        run: |
          wget -q https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
      
      - name: Upload archive to MinIO
        env:
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          ARCHIVE_NAME=${{ needs.deploy-ssh.outputs.archive_name }}
          ./mc alias set codegen-backup "${{ env.MINIO_ENDPOINT }}" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
          ./mc cp "$ARCHIVE_NAME" "${{ env.MINIO_BUCKET }}/"
          
          # Проверяем успешность загрузки
          ./mc ls "${{ env.MINIO_BUCKET }}/$ARCHIVE_NAME" || exit 1
          echo "Backup uploaded: $ARCHIVE_NAME"