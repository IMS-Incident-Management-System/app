# Опционально: генерация .env из Vault. Не используется в make dev / make prod.
# Требует .env-files/.env-generator.env (см. README).
services:
  ims-env-generator:
    image: nexus.code-generation.ru/docker-company-artifacts/env-generator:latest
    env_file:
      - ./.env-files/.env-generator.env
    volumes:
      - ./.env:/app/config/.env
    restart: "no"
