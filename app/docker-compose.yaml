services:
  ims-env-generator:
    profiles: ["ims-env-generator"]
    image: nexus.code-generation.ru/docker-company-artifacts/env-generator:latest
    env_file:
      - ./.env-files/.env-generator.env
    volumes:
      - ./.env:/app/config/.env
    restart: "no"

  ims-nginx:
    image: nginx:alpine
    container_name: ${NGINX_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx/${NODE_ENV}/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/letsencrypt:ro
      - webroot:/var/www/certbot:ro
      - uploads:/usr/share/nginx/uploads:ro
    networks:
      - ims-base-network

  ims-backend:
    build:
      context: .
      dockerfile: backend/${BACKEND_DEV_DOCKERFILE:-Dockerfile}
      args:
        # Пусто в dev (.env.development); MTS Nexus в prod (.env.production)
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    restart: unless-stopped
    container_name: ims-backend
    environment:
      - NODE_ENV=${NODE_ENV}
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
      - SSL_CERT_DIR=${SSL_CERT_DIR:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - KEYCLOAK_URL=${BACKEND_KEYCLOAK_URL}
      - KEYCLOAK_URL_ISSUER=${BACKEND_KEYCLOAK_URL_ISSUER}
      - KEYCLOAK_REALM=${BACKEND_KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${BACKEND_KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_ID_FE=${BACKEND_KEYCLOAK_CLIENT_ID_FE}
      - KEYCLOAK_CLIENT_SECRET=${BACKEND_KEYCLOAK_CLIENT_SECRET}
      - POSTGRES_DB=${BACKEND_POSTGRES_DB}
      - POSTGRES_USER=${BACKEND_POSTGRES_USER}
      - POSTGRES_PASSWORD=${BACKEND_POSTGRES_PASSWORD}
      - POSTGRES_HOST=${BACKEND_POSTGRES_HOST}
      - POSTGRES_PORT=${BACKEND_POSTGRES_PORT}
      - FIRST_ADMIN_EXTERNAL_ID=${FIRST_ADMIN_EXTERNAL_ID}
      - MAIL_ENABLED=${MAIL_ENABLED:-false}
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST:-smtp.yandex.ru}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-465}
      - MAIL_SMTP_SECURE=${MAIL_SMTP_SECURE:-true}
      - MAIL_SMTP_USER=${MAIL_SMTP_USER:-}
      - MAIL_SMTP_PASSWORD=${MAIL_SMTP_PASSWORD:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-IMS}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_IS_DB_RECIPIENTS=${MAIL_IS_DB_RECIPIENTS:-}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost:8026}
    volumes:
      - certs:/app/certs:ro
      - ${BACKEND_DEV_VOLUME:-empty_volume}:/app
      - ${BACKEND_DEV_NODE_MODULES_VOLUME:-empty_volume}:/app/node_modules
      - uploads:/app/uploads
    ports:
      - 8091:8091
    depends_on:
      - ims-postgres
    networks:
      - ims-base-network

  ims-keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:latest}
    restart: unless-stopped
    container_name: ims-keycloak
    environment:
      - KC_CACHE=${KC_CACHE:-local}
      - KC_DB=${KC_OWN_KC_DB}
      - KC_DB_PASSWORD=${KC_OWN_KC_DB_PASSWORD}
      - KC_DB_URL=${KC_OWN_KC_DB_URL}
      - KC_DB_USERNAME=${KC_OWN_KC_DB_USERNAME}
      - KC_HOSTNAME=${KC_OWN_KC_HOSTNAME}
      - KEYCLOAK_ADMIN=${KC_OWN_KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KC_OWN_KEYCLOAK_ADMIN_PASSWORD}
      - KEYCLOAK_FRONTEND_URL=${KC_OWN_KEYCLOAK_FRONTEND_URL}
    volumes:
      - ./keycloak:/opt/keycloak/conf
      - certs:/etc/letsencrypt:ro
    ports:
      - "${KC_PORT_MAPPING:-8087:8080}"
    command: "${KC_COMMAND:-start-dev}"
    user: root
    depends_on:
      - ims-keycloak-db
    networks:
      - ims-base-network

  ims-keycloak-db:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: ims-keycloak-db
    environment:
      - POSTGRES_DB=${KC_OWN_POSTGRES_DB}
      - POSTGRES_PASSWORD=${KC_OWN_POSTGRES_PASSWORD}
      - POSTGRES_USER=${KC_OWN_POSTGRES_USER}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - ims-base-network

  ims-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    container_name: ims-postgres
    environment:
      - POSTGRES_DB=${BACKEND_POSTGRES_DB}
      - POSTGRES_PASSWORD=${BACKEND_POSTGRES_PASSWORD}
      - POSTGRES_USER=${BACKEND_POSTGRES_USER}
      - POSTGRES_HOST=${BACKEND_POSTGRES_HOST}
      - POSTGRES_PORT=${BACKEND_POSTGRES_PORT}
    volumes:
      - ims-db-data:/var/lib/postgresql/data
    networks:
      - ims-base-network

  # ims-pgadmin:
  #   image: dpage/pgadmin4
  #   restart: unless-stopped
  #   container_name: ims-pgadmin
  #   environment:
  #     - DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
  #     - DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
  #   ports:
  #     - 8056:80
  #   volumes:
  #     - pgadmin-data:/var/lib/pgadmin
  #   networks:
  #     - ims-base-network
  #   depends_on:
  #     - ims-postgres

# Тома: docker compose down (без -v) их НЕ удаляет. Никогда не запускать down -v на проде — иначе потеряются БД и загрузки.
volumes:
  keycloak-db-data:
  # Фиксированное имя тома — данные БД не теряются при деплое из другого каталога или с другим project name
  ims-db-data:
    name: ims_ims-db-data
  pgadmin-data:
  empty_volume:  # Пустой volume для production (когда не нужны dev volumes)
  node_modules_volume:  # Для development node_modules
  certs:
    external: true
  webroot:
    external: true
  uploads:  # Volume для хранения загруженных файлов

networks:
  ims-base-network:
    driver: bridge
