user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80 default_server;
        server_name localhost; # <- впишите свои домены

        # ACME HTTP‑01 challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Keycloak: внутри сети compose слушает 8080 (8087 — только проброс на хост)
        location /auth/ {
            proxy_pass http://ims-keycloak:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html =404;
        }

        # Проксирование запросов к бэкенду
        location /api/ {
            proxy_pass http://ims-backend:8091/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # В development CORS обрабатывается backend, не добавляем заголовки nginx
        }

        # Отдача статических файлов из директории uploads
        location /uploads/ {
            alias /usr/share/nginx/uploads/;
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }
    }
    
}