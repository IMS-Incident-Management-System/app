user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # HTTP: ACME HTTP-01 challenge + редирект на HTTPS
    server {
        listen       80 default_server;
        server_name  0000pamkiiavdb.msk.mts.ru www.0000pamkiiavdb.msk.mts.ru;

        # ACME HTTP‑01 challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Всё остальное — редирект на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: основной сервер
    server {
        listen              443 ssl http2 default_server;
        server_name         0000pamkiiavdb.msk.mts.ru www.0000pamkiiavdb.msk.mts.ru;

        ssl_certificate     /etc/letsencrypt/live/0000PAMKIIAVDB.msk.mts.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/0000PAMKIIAVDB.msk.mts.ru/privkey.pem;

        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location = /auth {
            return 301 https://$host/auth/;
        }

        # Проксирование Keycloak (внутри compose слушает 8080, путь /auth)
        location /auth/ {
            proxy_pass http://ims-keycloak:8080/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html =404;
        }

        # Отдача статических файлов из директории uploads
        location /uploads/ {
            alias /usr/share/nginx/uploads/;
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }

        # Проксирование запросов к бэкенду
        location /api/ {
            proxy_pass https://ims-backend:8091/api/v1/;
            proxy_http_version 1.1;
            proxy_connect_timeout 60s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # CORS заголовки
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,X-Requested-With' always;

            # Preflight (OPTIONS) запросы
            if ($request_method = OPTIONS ) {
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }
    }
}
